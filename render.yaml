# Render Blueprint for the Snappsense API (FastAPI).
# New → Blueprint → pick this repo. Free plan works; it sleeps when idle.
services:
  - type: web
    name: snappsense-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      # Comma-separated list of allowed frontend origins (your Vercel URL).
      - key: SNAPPSENSE_CORS
        value: https://snappsense-app.vercel.app
      # Also allow Vercel preview deployments of this project.
      - key: SNAPPSENSE_CORS_REGEX
        value: ^https://snappsense-app(-[a-z0-9-]+)*\.vercel\.app$
      - key: SNAPPSENSE_LOCAL_MODEL
        value: ""
      # Sized for the free plan's 512 MB: fewer reviews per run, smaller and
      # fewer simultaneous Play pages, and a shorter trend budget.
      - key: SNAPPSENSE_CURRENT_MAX
        value: "20000"
      - key: SNAPPSENSE_PLAY_PAGE
        value: "2000"
      - key: SNAPPSENSE_PLAY_INFLIGHT
        value: "2"
      - key: SNAPPSENSE_TREND_BUDGET
        value: "35"
      - key: SNAPPSENSE_TREND_LANES
        value: "2"
      - key: SNAPPSENSE_MAX_REVIEWS
        value: "50000"
      # Fewer malloc arenas: noticeably lower memory for threaded Python on Linux.
      - key: MALLOC_ARENA_MAX
        value: "2"
